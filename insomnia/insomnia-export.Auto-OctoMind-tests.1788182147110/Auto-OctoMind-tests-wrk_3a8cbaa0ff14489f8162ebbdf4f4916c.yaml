collection:
  - url: "{{ base_url }}/api/users/register"
    name: Register user
    meta:
      id: req_3c295c8a67e245b498e22af9eea78735
      created: 1788177183138
      modified: 1788177645888
      isPrivate: false
      description: ""
      sortKey: -1788177454900
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "email": "{{ email }}",
          "password": "{{ password }}",
          "displayName": "Insomnia Test User"
        }
    headers:
      - name: Content-Type
        value: application/json
    scripts:
      preRequest: |-
        const uniqueEmail = `insomnia-test-${Date.now()}@example.com`;

        insomnia.environment.set("email", uniqueEmail);
      afterResponse: >-
        const body = insomnia.response.json();


        insomnia.test('Register user returns 201', () => {
            insomnia.expect(insomnia.response.code).to.eql(201);
        });


        insomnia.test('Registered user has expected email', () => {
            insomnia.expect(body.email).to.eql(insomnia.environment.get('email'));
        });


        insomnia.test('Registered user has an id', () => {
            insomnia.expect(body.id).to.be.a('number');
        });


        insomnia.environment.set('user_id', body.id);
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
