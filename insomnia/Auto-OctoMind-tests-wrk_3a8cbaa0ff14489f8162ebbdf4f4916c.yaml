    children:
      - url: "{{ base_url }}/api/mind-combinations"
        name: Сreate Combination
        meta:
          id: req_de503554a2af4454873795fa8dc714e9
          created: 1788265922732
          modified: 1788288834434
          isPrivate: false
          description: ""
          sortKey: -1788288049207
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "mindIds": [
                {{ mind_id_1 }},
                {{ mind_id_2 }}
              ]
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: bearer
          token: "{{ token }}"
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();

            const mindId1 = Number(insomnia.environment.get('mind_id_1'));
            const mindId2 = Number(insomnia.environment.get('mind_id_2'));

            insomnia.test('Create combination returns 201', () => {
                insomnia.expect(insomnia.response.code).to.eql(201);
            });

            insomnia.test('Created combination has an id', () => {
                insomnia.expect(body.id).to.be.a('number');
            });

            insomnia.test('Combination contains 2 minds', () => {
                insomnia.expect(body.minds).to.be.an('array');
                insomnia.expect(body.minds.length).to.eql(2);
            });

            insomnia.test('Combination contains requested minds', () => {
                const ids = body.minds.map(mind => mind.id);

                insomnia.expect(ids).to.include(mindId1);
                insomnia.expect(ids).to.include(mindId2);
            });

            insomnia.environment.set('combination_id', body.id);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
