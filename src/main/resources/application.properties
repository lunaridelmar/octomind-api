spring.application.name=octomind-api

spring.datasource.url=jdbc:postgresql://localhost:5432/octomind
spring.datasource.username=octomind
spring.datasource.password=octomind

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=3600

octomind.generator.type=ai

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash